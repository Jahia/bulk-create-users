# Dependabot version updates configuration.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Module frontend (Module Federation app bundled by webpack)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Shared Module Federation libraries: versions are dictated by the Jahia platform
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-redux"
        update-types: ["version-update:semver-major"]
      # Babel 8 (#53: preset-env 8, plugin-transform-classes 8): needs @babel/core 8,
      # Node >= 22.18 and a coordinated plugin migration.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # ESLint 10 drops eslintrc support; @jahia/eslint-config 2.x and .eslintrc are eslintrc-based.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Cypress end-to-end test harness
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-tests-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 6/7 break the Cypress config here (TS 7: `require is not defined`; TS 6: TS5107 on
      # moduleResolution=node10 / target=ES5). Hold the major until tests/tsconfig is migrated (2026-11 e2e).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/cypress"
        update-types: ["version-update:semver-major"]

  # Maven build
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia parent and platform artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      # frontend-maven-plugin 2.x requires a Java 17 Maven runtime
      - dependency-name: "com.github.eirslett:frontend-maven-plugin"
        update-types: ["version-update:semver-major"]
      # OSGi spec artifacts (e.g. DS annotations 1.5) raise Require-Capability /
      # Import-Package floors above what Jahia 8.2 provides (Felix SCR 2.1.30 = DS 1.4).
      - dependency-name: "org.osgi:*"
